# ── Server ────────────────────────────────────────────────────────────────────
# Render sets PORT env var; default to 8080 for local/docker-compose usage.
server.port=${PORT:8080}

# ── DataSource ────────────────────────────────────────────────────────────────
# SPRING_DATASOURCE_URL is set by docker-compose.
# On Render, individual DB_* vars are injected via the render.yaml fromDatabase
# references so the nested fallback builds the JDBC URL automatically.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:camplink}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:camplink}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:camplink_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool — sensible defaults for Render Starter containers.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
# REQUIRED in production — must be at least 64 random characters.
jwt.secret=${JWT_SECRET:dev_secret_change_in_production_min_64_chars_padding_here_x}
jwt.expiry-ms=${JWT_EXPIRY_MS:604800000}

# ── Google Sign-In ────────────────────────────────────────────────────────────
# Comma-separated list of accepted OAuth client IDs — the "aud" claim of the
# Google ID token must match one of these. MUST include the WEB client ID
# (client_type 3) used as `serverClientId` in the Flutter app, since Android's
# serverClientId flow issues tokens with the web client as the audience.
# Add the iOS client ID here too once iOS sign-in is wired up.
google.client-ids=${GOOGLE_CLIENT_IDS:539638376002-c7kjflgfit25iv08gruoe2hifaj659ao.apps.googleusercontent.com}

# ── Push notifications (Firebase Cloud Messaging) ─────────────────────────────
# Path to a Firebase service-account JSON (Firebase console → Project settings →
# Service accounts → Generate new private key). Leave blank to disable push —
# in-app notifications still work. GOOGLE_APPLICATION_CREDENTIALS also works.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# ── File uploads ──────────────────────────────────────────────────────────────
# When CLOUDINARY_URL is set, uploads go to Cloudinary (persistent, CDN-served)
# and the upload endpoint returns the Cloudinary https URL. Otherwise images are
# written to the local disk below — fine for dev, but EPHEMERAL on Render's free
# tier (lost on every redeploy), so configure Cloudinary in production.
#
# Get the value from the Cloudinary dashboard (Account Details → "API
# environment variable"); it looks like:
#   cloudinary://<api_key>:<api_secret>@<cloud_name>
cloudinary.url=${CLOUDINARY_URL:}

# Local-disk fallback (used only when Cloudinary is not configured).
upload.dir=${UPLOAD_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS ──────────────────────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS to your Flutter web / PWA origin in production.
# Example: https://camplink.onrender.com,https://camplink.example.com
allowed.origins=${ALLOWED_ORIGINS:*}

# ── Demo data seeding ─────────────────────────────────────────────────────────
# Set SEED_DATA=true only for the first deployment or a dev environment.
# The seeder is a no-op when the database already has users.
app.seed-data=${SEED_DATA:false}

# ── Actuator ──────────────────────────────────────────────────────────────────
# Expose only the health endpoint; Render uses it as a liveness probe.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
# Interactive API docs → GET /docs
# Raw OpenAPI JSON     → GET /v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.camplink=INFO
